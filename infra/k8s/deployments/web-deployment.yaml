apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-web
  namespace: aios
  labels:
    app: aios-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aios-web
  template:
    metadata:
      labels:
        app: aios-web
    spec:
      containers:
        - name: web
          image: aios-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: NEXT_PUBLIC_WS_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
