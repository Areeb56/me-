apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-orchestrator
  namespace: aios
  labels:
    app: aios-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aios-orchestrator
  template:
    metadata:
      labels:
        app: aios-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: aios-orchestrator:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: REDIS_URL
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: CHROMA_HOST
              value: "http://chromadb:8000"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: OPENROUTER_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: GEMINI_API_KEY
            - name: DEFAULT_MODEL
              value: "llama3:70b"
            - name: FALLBACK_MODEL
              value: "openrouter/anthropic/claude-3.5-sonnet"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
