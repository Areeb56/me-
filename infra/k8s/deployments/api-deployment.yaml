apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-api
  namespace: aios
  labels:
    app: aios-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aios-api
  template:
    metadata:
      labels:
        app: aios-api
    spec:
      containers:
        - name: api
          image: aios-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: REDIS_URL
            - name: ORCHESTRATOR_URL
              value: "http://aios-orchestrator:8001"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: ENCRYPTION_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
