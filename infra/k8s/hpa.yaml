apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aios-api-hpa
  namespace: aios
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aios-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
