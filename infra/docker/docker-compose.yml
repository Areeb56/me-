name: aios

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aios
      POSTGRES_USER: aios_user
      POSTGRES_PASSWORD: aios_password_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios_user -d aios"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aios_user:aios_password_local@postgres:5432/aios
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://orchestrator:8001
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: "aios-jwt-secret-change-in-production-2024"
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ../../apps/api:/app
      - /app/node_modules

  orchestrator:
    build:
      context: ../../apps/orchestrator
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aios_user:aios_password_local@postgres:5432/aios
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      CHROMA_HOST: http://chromadb:8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-sk-or-placeholder}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-placeholder}
      DEFAULT_MODEL: llama3:70b
      FALLBACK_MODEL: openrouter/anthropic/claude-3.5-sonnet
    ports:
      - "8001:8001"
    volumes:
      - ../../apps/orchestrator:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  chroma_data:
