[tool.poetry]
name = "aios-orchestrator"
version = "1.0.0"
description = "Python orchestrator for AIOS using FastAPI and LangGraph"
authors = ["AIOS Team"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = { version = "^0.24.0", extras = ["standard"] }
langgraph = "^0.0.20"
langchain = "^0.1.0"
langchain-community = "^0.0.10"
psycopg2-binary = "^2.9.0"
asyncpg = "^0.29.0"
redis = "^4.6.0"
ollama = "^0.2.5"
openai = "^0.28.0"
anthropic = "^0.7.8"
google-generativeai = "^0.3.2"
chromadb = "^0.4.22"
playwright = "^1.40.0"
browser-use = "^0.1.0"
pydantic = "^2.5.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
black = "^23.0.0"
flake8 = "^6.1.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
