version: '"3.8"'

services:
  # Frontend - Next.js
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - redis
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  # Backend - Fastify Node.js API
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - chromadb
      - ollama
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/aios
      - REDIS_URL=redis://redis:6379
      - CHROMADB_URL=http://chromadb:8000
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./apps/api:/app

  # Orchestrator - Python FastAPI + LangGraph
  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - chromadb
      - ollama
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/aios
      - REDIS_URL=redis://redis:6379
      - CHROMADB_URL=http://chromadb:8000
      - OLLAMA_HOST=http://ollama:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./apps/orchestrator:/app

  # Database - PostgreSQL
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=aios
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache & Queue - Redis
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Vector Database - ChromaDB
  chromadb:
    image: chromadb/chromadb
    ports:
      - "8002:8000"
    volumes:
      - chromadb_data:/chroma

  # Local LLM - Ollama
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Ollama will auto-pull models on first use via API calls

volumes:
  postgres_data:
  chromadb_data:
  ollama_data:
